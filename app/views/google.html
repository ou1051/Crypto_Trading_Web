<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.ProductCode}} Chart</title>
    <style>
        #chart_div { width: 600px; max-width: 100%; height: 400px; border: 1px solid #ccc; }
    </style>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>
    <div>{{.ProductCode}}</div>
    <p>Duration: {{.Duration}} / Time: UTC</p>
    {{if not .Rows}}<p>Waiting for market data. Reload after a few moments.</p>{{end}}
    <div id="chart_div" role="img" aria-label="{{.ProductCode}} candlestick chart"></div>
    <p>Reload for the latest data.</p>
    <script>
        const rows = {{.Rows}};
        if (typeof google === 'undefined') {
            document.getElementById('chart_div').textContent = 'Could not load Google Charts. Check your connection.';
        } else {
            google.charts.load('current', {packages: ['corechart'], language: 'en'});
            google.charts.setOnLoadCallback(drawChart);
        }
        function drawChart() {
            if (rows.length === 0) return;
            const data = new google.visualization.DataTable();
            data.addColumn('string', 'Time (UTC)');
            data.addColumn('number', 'Low');
            data.addColumn('number', 'Open');
            data.addColumn('number', 'Close');
            data.addColumn('number', 'High');
            data.addRows(rows);
            const chart = new google.visualization.CandlestickChart(document.getElementById('chart_div'));
            chart.draw(data, {
                height: 400,
                legend: 'none',
                candlestick: {
                    fallingColor: {strokeWidth: 0, fill: '#a52714'},
                    risingColor: {strokeWidth: 0, fill: '#0f9d58'}
                }
            });
        }
        window.addEventListener('resize', function () {
            if (typeof google !== 'undefined' && google.visualization) drawChart();
        });
    </script>
</body>
</html>
